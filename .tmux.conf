unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-b

set -g mouse on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# Use prefix-s to save a session and prefix-r to restore the saved session
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-enable true

set -g history-limit 1000000

set -g @plugin 'dracula/tmux'

# available plugins: battery, cpu-usage, git, gpu-usage, ram-usage, tmux-ram-usage, network, network-bandwidth, network-ping, ssh-session, attached-clients, network-vpn, weather, time, mpc, spotify-tui, playerctl, kubernetes-context, synchronize-panes
set -g @dracula-plugins "cpu-usage ram-usage gpu-usage git ssh-session attached-clients time"

set -g @dracula-border-contrast false
set -g @dracula-show-location false
set -g @dracula-show-timezone false
set -g @dracula-day-month true
set -g @dracula-military-time true
set -g @dracula-cpu-display-load false
set -g @dracula-network-bandwidth-show-interface true
set -g @dracula-show-left-icon session
set -g @dracula-show-fahrenheit false
set -g @dracula-fixed-location "Rome"

# available colors: white, gray, dark_gray, light_purple, dark_purple, cyan, green, orange, red, pink, yellow
# set -g @dracula-[plugin-name]-colors "[background] [foreground]"
set -g @dracula-cpu-usage-colors "orange dark_gray"
set -g @dracula-ram-usage-colors "pink dark_gray"
set -g @dracula-weather-colors "light_purple dark_gray"
set -g @dracula-time-colors "green dark_gray"

# GPU usage: cyan background (cool tech feel)
set -g @dracula-gpu-usage-colors "cyan dark_gray"

# Git: yellow for branch/status highlight
set -g @dracula-git-colors "yellow dark_gray"

# SSH session: red for remote awareness
set -g @dracula-ssh-session-colors "red dark_gray"

# Attached clients: cyan for multi-client indicator
set -g @dracula-attached-clients-colors "cyan dark_gray"


# --- agent persistence (2026-10-28): auto-save + auto-restore dopo reboot ---
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
# ripristina i processi claude come "claude -c" (continua l ultima sessione della dir)
set -g @resurrect-processes ' ~claude->claude -c'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# New pane start from current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
